<title>Theo streams</title>
<h1>Theo streams</h1>
<p>A personal tool that adds Theo (t3dotgg) stream VODs to its owner's private YouTube playlist once a day.
It is used only by its owner, on the owner's own YouTube account.</p>
<p>Source code: <a href="https://github.com/ussblade/theo-streams-playlist">github.com/ussblade/theo-streams-playlist</a> · <a href="privacy.html">Privacy policy</a></p>
